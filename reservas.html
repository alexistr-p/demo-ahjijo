<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ah Jijo! Cantaritos Metepec | Los Más Chidos</title>
    <!-- Google Fonts: Oswald y Montserrat para estilo Urbano/Industrial -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="styles.css" rel="stylesheet">
    

</head>
<body>

    <!-- NAVEGACIÓN PRINCIPAL -->
    <header>
        <div class="logo">AH JIJO! <span>CANTARITOS</span></div>
        <nav>
            <ul>
                <li><a href="#concepto">El Concepto</a></li>
                <li><a href="#menu">Menú & Drinks</a></li>
                <li><a href="#ubicacion">Ubicación</a></li>
            </ul>
        </nav>
    </header>


    <!-- Sección de Reserva Ah Jijo -->
<section id="reserva-ah-jijo" style="max-width: 500px; margin: 2rem auto; margin-top: 7rem; padding: 1.5rem; border-radius: 12px; background-color: #f9f9f9; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-family: sans-serif;">
  <h2 style="text-align: center; color: #d32f2f; margin-bottom: 1rem;">¡Haz tu Reserva en Ah Jijo! 🍹</h2>
  
  <form id="formReserva" onsubmit="enviarReservaWhatsApp(event)" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
        <h4 style="color:rgb(44, 44, 44)">Nombre:</h4>
      <label for="nombre" style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Nombre completo:</label>
      <input type="text" id="nombre" required placeholder="Nombre:" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div>
       <h4 style="color: rgb(44, 44, 44);">Dia:</h4>
      <label for="dia" style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Día de la reserva:</label>
      <input type="date" id="dia" required style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div>
         <h4 style="color: rgb(44, 44, 44);">Hora:</h4>
      <label for="hora" style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Hora:</label>
      <input type="time" id="hora" required style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <div>
      <label for="personas" style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Cantidad de personas:</label>
      <input type="number" id="personas" min="1" max="50" required placeholder="Ej. 4" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
    </div>

    <button type="submit" style="background-color: #25D366; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem;">
      Confirmar por WhatsApp
    </button>
  </form>
</section>

<script>
function enviarReservaWhatsApp(event) {
  event.preventDefault();

  // Cambia este número por el número de WhatsApp de "Ah Jijo" con su código de país (ej. 521234567890 para México)
  const telefonoAhJijo = "527226475246";

  const nombre = document.getElementById('nombre').value;
  const dia = document.getElementById('dia').value;
  const hora = document.getElementById('hora').value;
  const personas = document.getElementById('personas').value;

  // Construcción del mensaje predefinido
  const mensaje = `¡Hola Ah Jijo! Quisiera hacer una reservación.
• A nombre de ${nombre},
• para el dia ${dia},
• a las ${hora},
• la cantidad de personas es: ${personas}`;

  // Codificar el texto para URL
  const mensajeUrl = encodeURIComponent(mensaje);

  // Redirección a la API de WhatsApp
  window.open(`https://api.whatsapp.com/send?phone=${telefonoAhJijo}&text=${mensajeUrl}`, '_blank');
}
</script>

    </footer>

    <script src="script.js"></script>

</body>
</html>
